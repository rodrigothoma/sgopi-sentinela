name: SGOPI Sentinela CI — Qualidade, Arquitetura & Testes

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-quality-and-tests:
    name: Backend — Arquitetura Hexagonal & Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./sgopi_ci.db
      SGOPI_E2E_BASE_URL: http://127.0.0.1:8000
      SGOPI_E2E_STRICT: "1"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Configurar Python 3.13
        run: uv python install 3.13

      - name: Instalar Dependências do Backend
        run: uv sync

      - name: 🏛️ Validar Contratos da Arquitetura Hexagonal (RNF05)
        run: PYTHONPATH=src uv run lint-imports --config pyproject.toml

      - name: 🗄️ Preparar Banco do CI (SQLite) + Seed
        run: |
          rm -f sgopi_ci.db
          uv run alembic upgrade head
          uv run python -m scripts.seed

      - name: Iniciar backend para os testes E2E
        run: |
          uv run uvicorn --app-dir src main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend disponível"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend não iniciou:"
              cat /tmp/backend.log
              exit 1
            fi

            sleep 1
          done

      - name: 🧪 Executar Testes Automatizados e Cobertura (RNF06 >= 80%)
        run: uv run pytest --cov

      - name: Encerrar backend E2E
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi
          if [ "${{ job.status }}" = "failure" ] && [ -f /tmp/backend.log ]; then
            echo "===== /tmp/backend.log ====="
            cat /tmp/backend.log
          fi

      - name: 🚫 Verificar Ausência de Resíduos de IA
        working-directory: .
        run: |
          echo "Verificando se há artefatos de chat de LLM..."
          ! grep -rn "contentReference" docs/ backend/src/ frontend/src/ || (echo "ERRO: Marcador de chat de IA encontrado!" && exit 1)

  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        run: npm ci || npm install

      - name: 🔍 Checagem de Tipos TypeScript (tsc)
        run: npx tsc --noEmit

      - name: 📦 Build de Produção (Vite)
        run: npm run build
