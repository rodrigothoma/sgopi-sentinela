name: SGOPI Sentinela CI — Qualidade, Arquitetura & Testes

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-quality-and-tests:
    name: Backend — Arquitetura Hexagonal & Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Configurar Python 3.13
        run: uv python install 3.13

      - name: Instalar Dependências do Backend
        run: uv sync

      - name: 🏛️ Validar Contratos da Arquitetura Hexagonal (RNF05)
        run: PYTHONPATH=src uv run lint-imports --config pyproject.toml

      - name: 🧪 Executar Testes Automatizados e Cobertura (RNF06 >= 80%)
        run: uv run pytest --cov

      - name: 🚫 Verificar Ausência de Resíduos de IA
        working-directory: .
        run: |
          echo "Verificando se há artefatos de chat de LLM..."
          ! grep -rn "contentReference" docs/ backend/src/ frontend/src/ || (echo "ERRO: Marcador de chat de IA encontrado!" && exit 1)

  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        run: npm ci || npm install

      - name: 🔍 Checagem de Tipos TypeScript (tsc)
        run: npx tsc --noEmit

      - name: 📦 Build de Produção (Vite)
        run: npm run build
