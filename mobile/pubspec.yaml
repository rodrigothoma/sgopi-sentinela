name: sgopi_mobile
description: "App mobile do SGOPI Sentinela: Agente de campo (RF01) e Delegado (RF04) sobre a API REST /v1."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  # Estado e injeção de dependências. `riverpod` (sem Flutter) é o único usado em application/.
  riverpod: ^3.5.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  # Adaptadores de saída (só em data/ e app/di.dart).
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
