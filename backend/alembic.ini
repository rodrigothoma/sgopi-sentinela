# Alembic — migrations do SGOPI Sentinela (RNF07 / HEX-11)
# Uso: uv run alembic upgrade head   |   uv run alembic revision -m "..."
[alembic]
script_location = src/infrastructure/database/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
# A URL real vem de settings.database_url (ver env.py); este valor é só placeholder.
sqlalchemy.url = postgresql+asyncpg://postgres:admin@localhost:5432/sgopi

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
