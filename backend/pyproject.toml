[project]
name = "sgopi-sentinela-backend"
version = "0.1.0"
description = "SGOPI Sentinela — Backend (FastAPI + Arquitetura Hexagonal)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
markers = ["e2e: testes ponta a ponta contra o backend real em :8000 (pulados se o servidor não estiver no ar)"]

# RNF06: cobertura >= 80 % em domain/ + application/ (uv run pytest --cov)
[tool.coverage.run]
source = ["src/domain", "src/application"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

# RNF05*: regra de ouro verificada por import-linter (uv run lint-imports)
[tool.importlinter]
root_packages = ["domain", "application", "adapters", "infrastructure"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain não importa nada externo nem outras camadas"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["application", "adapters", "infrastructure", "fastapi", "starlette", "sqlalchemy", "pydantic", "jose", "argon2", "alembic"]

[[tool.importlinter.contracts]]
name = "application só importa domain"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["adapters", "infrastructure", "fastapi", "starlette", "sqlalchemy", "pydantic", "jose", "argon2", "alembic"]

[[tool.importlinter.contracts]]
name = "camadas: adapters > infrastructure > application > domain (di.py é o composition root, única exceção)"
type = "layers"
layers = ["adapters", "infrastructure", "application", "domain"]
ignore_imports = ["infrastructure.di -> adapters.**"]

[tool.uv]
package = false
